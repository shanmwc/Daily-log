  <style>
    body { font-family: Arial, sans-serif; margin: 0; background: #f3f7f3; color: #1f2d1f; }
    header { background: #2f6b3f; color: white; padding: 18px; text-align: center; }
    header h1 { margin: 0; font-size: 24px; }
    header p { margin: 6px 0 0; font-size: 14px; }
    main { max-width: 900px; margin: 18px auto; background: white; padding: 18px; border-radius: 14px; box-shadow: 0 2px 12px rgba(0,0,0,0.10); }
    label { font-weight: bold; display: block; margin-top: 12px; }
    input, select, textarea { width: 100%; padding: 11px; margin-top: 5px; border: 1px solid #b7c7b7; border-radius: 8px; font-size: 16px; box-sizing: border-box; }
    textarea { min-height: 80px; resize: vertical; }
    .row { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
    .subject-box { margin-top: 14px; padding: 14px; background: #e8f3e8; border-left: 5px solid #2f6b3f; border-radius: 8px; font-size: 18px; }
    button { margin-top: 18px; padding: 13px 18px; border: 0; border-radius: 9px; font-size: 17px; cursor: pointer; font-weight: bold; }
    .save { background: #2f6b3f; color: white; width: 100%; }
    .clear { background: #dfe8df; color: #1f2d1f; width: 100%; }
    .note { background: #fff8df; padding: 12px; border-radius: 8px; margin-top: 16px; font-size: 14px; }
    .small { font-size: 13px; color: #496149; }
    @media (max-width: 700px) { .row { grid-template-columns: 1fr; } main { margin: 10px; } }
  </style>
</head>
<body>
  <header>
    <h1>ELA MYP-DP Daily Log - Single File</h1>
    <p>Session-wise class log for MYP 1 to DP 2</p>
  </header>

  <main>
    <div class="note">
      Teachers fill only their own session and click <b>Save Session</b>. The entry will go to the school Excel file through Power Automate once the URL is added.
    </div>

    <form id="dailyLogForm">
      <div class="row">
        <div>
          <label for="date">Date</label>
          <input type="date" id="date" required />
        </div>
        <div>
          <label for="day">Day</label>
          <select id="day" required>
            <option value="">Select day</option>
            <option value="MON">Monday</option>
            <option value="TUE">Tuesday</option>
            <option value="WED">Wednesday</option>
            <option value="THU">Thursday</option>
            <option value="FRI">Friday</option>
          </select>
        </div>
      </div>

      <div class="row">
        <div>
          <label for="grade">Grade / Section</label>
          <select id="grade" required></select>
        </div>
        <div>
          <label for="session">Session</label>
          <select id="session" required>
            <option value="">Select grade and day first</option>
          </select>
        </div>
      </div>

      <div class="subject-box">
        <b>Subject:</b> <span id="subjectDisplay">Select grade, day and session</span><br>
        <span class="small"><b>Time:</b> <span id="timeDisplay">-</span></span>
      </div>

      <label for="teacher">Teacher Name</label>
      <input type="text" id="teacher" placeholder="Enter teacher name" required />

      <label for="topic">Topic / Concept taught</label>
      <textarea id="topic" placeholder="What was taught today?" required></textarea>

      <label for="classwork">Classwork / Learning engagement</label>
      <textarea id="classwork" placeholder="Class activities, discussion, experiment, practice, group work, etc."></textarea>

      <label for="homework">Homework / Assignment</label>
      <textarea id="homework" placeholder="Enter homework or assignment. Write Nil if nothing was assigned."></textarea>

      <div class="row">
        <div>
          <label for="dueDate">Due Date</label>
          <input type="date" id="dueDate" />
        </div>
        <div>
          <label for="status">Status</label>
          <select id="status">
            <option value="Saved">Saved</option>
            <option value="Final">Final</option>
          </select>
        </div>
      </div>

      <label for="remarks">Remarks / Follow-up</label>
      <textarea id="remarks" placeholder="Absentees, concerns, follow-up, reminders, etc."></textarea>

      <button type="submit" class="save">Save Session</button>
      <button type="button" class="clear" onclick="clearForm()">Clear Form</button>
    </form>

    <div id="message" class="note" style="display:none;"></div>
  </main>

  <script>
    // After creating the Power Automate flow, paste its HTTP URL below between the quotes.
    const POWER_AUTOMATE_SAVE_URL = "";

    const gradeSelect = document.getElementById('grade');
    const daySelect = document.getElementById('day');
    const sessionSelect = document.getElementById('session');
    const subjectDisplay = document.getElementById('subjectDisplay');
    const timeDisplay = document.getElementById('timeDisplay');
    const messageBox = document.getElementById('message');

    document.getElementById('date').valueAsDate = new Date();

    function initGrades() {
      gradeSelect.innerHTML = '<option value="">Select grade</option>';
      Object.keys(sessionSubjectMap).forEach(grade => {
        const option = document.createElement('option');
        option.value = grade;
        option.textContent = grade;
        gradeSelect.appendChild(option);
      });
    }

    function updateSessions() {
      const grade = gradeSelect.value;
      const day = daySelect.value;
      sessionSelect.innerHTML = '<option value="">Select session</option>';
      subjectDisplay.textContent = 'Select grade, day and session';
      timeDisplay.textContent = '-';

      if (!grade || !day || !sessionSubjectMap[grade] || !sessionSubjectMap[grade][day]) return;

      Object.keys(sessionSubjectMap[grade][day]).forEach(sessionKey => {
        const item = sessionSubjectMap[grade][day][sessionKey];
        const option = document.createElement('option');
        option.value = sessionKey;
        option.textContent = `Session ${sessionKey} - ${item.time} - ${item.subject}`;
        sessionSelect.appendChild(option);
      });
    }

    function updateSubject() {
      const grade = gradeSelect.value;
      const day = daySelect.value;
      const session = sessionSelect.value;
      if (grade && day && session && sessionSubjectMap[grade]?.[day]?.[session]) {
        const item = sessionSubjectMap[grade][day][session];
        subjectDisplay.textContent = item.subject;
        timeDisplay.textContent = item.time;
      }
    }

    gradeSelect.addEventListener('change', updateSessions);
    daySelect.addEventListener('change', updateSessions);
    sessionSelect.addEventListener('change', updateSubject);

    function showMessage(text) {
      messageBox.style.display = 'block';
      messageBox.textContent = text;
      window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' });
    }

    function clearForm() {
      document.getElementById('dailyLogForm').reset();
      document.getElementById('date').valueAsDate = new Date();
      updateSessions();
      subjectDisplay.textContent = 'Select grade, day and session';
      timeDisplay.textContent = '-';
      messageBox.style.display = 'none';
    }

    document.getElementById('dailyLogForm').addEventListener('submit', async function(e) {
      e.preventDefault();

      const grade = gradeSelect.value;
      const day = daySelect.value;
      const session = sessionSelect.value;
      const timetableItem = sessionSubjectMap[grade]?.[day]?.[session];

      const data = {
        Date: document.getElementById('date').value,
        Grade: grade,
        Day: day,
        Session: session,
        Time: timetableItem?.time || '',
        Subject: timetableItem?.subject || '',
        Teacher: document.getElementById('teacher').value,
        Topic: document.getElementById('topic').value,
        Classwork: document.getElementById('classwork').value,
        Homework: document.getElementById('homework').value,
        DueDate: document.getElementById('dueDate').value,
        Remarks: document.getElementById('remarks').value,
        Status: document.getElementById('status').value,
        SubmittedAt: new Date().toISOString()
      };

      if (!POWER_AUTOMATE_SAVE_URL) {
        console.log('Daily log entry:', data);
        showMessage('The form is ready, but the Power Automate URL has not been added yet. After adding the URL, entries will save into Excel/Teams.');
        return;
      }

      try {
        const response = await fetch(POWER_AUTOMATE_SAVE_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(data)
        });

        if (response.ok) {
          showMessage('Saved successfully. This session entry has been sent.');
          document.getElementById('topic').value = '';
          document.getElementById('classwork').value = '';
          document.getElementById('homework').value = '';
          document.getElementById('dueDate').value = '';
          document.getElementById('remarks').value = '';
        } else {
          showMessage('Could not save. Please check the Power Automate flow.');
        }
      } catch (error) {
        showMessage('Could not connect to Power Automate. Please check the flow URL and internet connection.');
      }
    });

    initGrades();
  </script>
</body>
</html>
