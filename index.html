<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>MYP-DP Daily Log</title>
<style>
  :root { --blue:#263f8f; --border:#d5dbe6; --bg:#f6f8fb; --text:#172033; }
  * { box-sizing: border-box; }
  body { margin:0; font-family: Arial, Helvetica, sans-serif; background:var(--bg); color:var(--text); }
  .page { max-width: 980px; margin: 0 auto; padding: 18px; }
  .card { background:white; border-radius:14px; box-shadow:0 2px 14px rgba(0,0,0,.08); padding:18px; }
  h1 { margin:0 0 14px; font-size:28px; color:var(--blue); }
  .top { display:grid; grid-template-columns: repeat(3, 1fr); gap:10px; margin-bottom:18px; }
  label { font-weight:700; display:block; margin-bottom:6px; }
  input, select, textarea { width:100%; border:1px solid #bfc7d1; border-radius:8px; padding:10px; font-size:16px; background:white; }
  textarea { min-height:76px; resize:vertical; }
  table { width:100%; border-collapse:collapse; table-layout:fixed; }
  th { background:var(--blue); color:white; text-align:left; padding:12px; font-size:16px; }
  td { border:1px solid var(--border); padding:10px; vertical-align:top; background:white; }
  th:nth-child(1) { width:15%; } th:nth-child(2) { width:22%; } th:nth-child(3) { width:23%; } th:nth-child(4) { width:20%; } th:nth-child(5) { width:10%; } th:nth-child(6) { width:10%; }
  .session { font-weight:700; } .time { margin-top:6px; font-weight:400; color:#4d5867; }
  .subject { font-weight:700; white-space:pre-wrap; }
  .actions { display:flex; gap:10px; flex-wrap:wrap; margin-top:16px; }
  button { border:0; border-radius:10px; padding:12px 16px; font-size:16px; font-weight:700; cursor:pointer; }
  .primary { background:#24713d; color:white; } .secondary { background:#e9edf5; color:#172033; } .danger { background:#ffe9e9; color:#8a1f1f; }
  .msg { margin-top:12px; font-weight:700; }
  @media (max-width: 760px) {
    .page { padding:8px; } .card { padding:10px; border-radius:0; } h1 { font-size:22px; }
    .top { grid-template-columns:1fr; } table { font-size:14px; } th,td { padding:6px; } input,select,textarea { font-size:14px; padding:8px; }
  }
  @media print {
    body { background:white; } .page { max-width:none; padding:0; } .card { box-shadow:none; } .actions, .msg { display:none; }
    input, select, textarea { border:0; padding:0; } textarea { height:auto; min-height:40px; }
  }
</style>
</head>
<body>
<div class="page"><div class="card">
  <h1>MYP-DP Daily Log</h1>
  <div class="top">
    <div><label for="logDate">Date</label><input id="logDate" type="date"></div>
    <div><label for="grade">Grade</label><select id="grade"></select></div>
    <div><label for="day">Day</label><select id="day"><option value="MON">Monday</option><option value="TUE">Tuesday</option><option value="WED">Wednesday</option><option value="THUR">Thursday</option><option value="FRI">Friday</option></select></div>
  </div>

  <table>
    <thead><tr>
      <th>Session & Time</th>
      <th>Subject</th>
      <th>Daily Learning Update</th>
      <th>Homework / Assignment</th>
      <th>Due Date</th>
      <th>Upcoming Assessment</th>
    </tr></thead>
    <tbody id="rows"></tbody>
  </table>

  <div class="actions">
    <button class="primary" onclick="saveDraft()">Save</button>
    <button class="secondary" onclick="loadDraft()">Recall Saved</button>
    <button class="secondary" onclick="window.print()">Save as PDF / Print</button>
    <button class="primary" onclick="submitFinal()">Submit Final Log</button>
    <button class="danger" onclick="clearDraft()">Clear</button>
  </div>
  <div class="msg" id="msg"></div>
</div></div>

// Paste your Power Automate HTTP URL between the quotes later.
const POWER_AUTOMATE_URL = "";

const gradeEl = document.getElementById('grade');
const dayEl = document.getElementById('day');
const dateEl = document.getElementById('logDate');
const rowsEl = document.getElementById('rows');
const msgEl = document.getElementById('msg');

function todayISO() {
  const d = new Date();
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
}

function init() {
  dateEl.value = todayISO();
  Object.keys(sessionSubjectMap).forEach(g => {
    const opt = document.createElement('option'); opt.value = g; opt.textContent = g; gradeEl.appendChild(opt);
  });
  gradeEl.addEventListener('change', renderRows);
  dayEl.addEventListener('change', renderRows);
  dateEl.addEventListener('change', renderRows);
  renderRows();
}

function renderRows() {
  const grade = gradeEl.value;
  const day = dayEl.value;
  const dayData = (sessionSubjectMap[grade] || {})[day] || {};
  rowsEl.innerHTML = '';
  Object.keys(dayData).sort((a,b)=>Number(a)-Number(b)).forEach(session => {
    const item = dayData[session];
    const tr = document.createElement('tr');
    tr.innerHTML = `
      <td><div class="session">Session ${session}</div><div class="time">${escapeHtml(item.time || '')}</div></td>
      <td><div class="subject">${escapeHtml(item.subject || '')}</div></td>
      <td><textarea data-field="learning" data-session="${session}"></textarea></td>
      <td><textarea data-field="homework" data-session="${session}"></textarea></td>
      <td><input type="date" data-field="dueDate" data-session="${session}"></td>
      <td><textarea data-field="assessment" data-session="${session}"></textarea></td>`;
    rowsEl.appendChild(tr);
  });
  loadDraft(false);
}

function storageKey() { return 'dailyLog_' + dateEl.value + '_' + gradeEl.value + '_' + dayEl.value; }

function collectData() {
  const grade = gradeEl.value, day = dayEl.value;
  const dayData = (sessionSubjectMap[grade] || {})[day] || {};
  const entries = Object.keys(dayData).sort((a,b)=>Number(a)-Number(b)).map(session => {
    const get = f => document.querySelector(`[data-session="${session}"][data-field="${f}"]`)?.value || '';
    return {
      session: session,
      time: dayData[session].time || '',
      subject: dayData[session].subject || '',
      dailyLearningUpdate: get('learning'),
      homeworkAssignment: get('homework'),
      dueDate: get('dueDate'),
      upcomingAssessment: get('assessment')
    };
  });
  return { date: dateEl.value, grade, day, entries };
}

function saveDraft() { localStorage.setItem(storageKey(), JSON.stringify(collectData())); msg('Saved on this device.'); }
function loadDraft(show=true) {
  const raw = localStorage.getItem(storageKey());
  if (!raw) { if(show) msg('No saved log found for this date, grade and day.'); return; }
  const data = JSON.parse(raw);
  data.entries.forEach(e => {
    setVal(e.session,'learning',e.dailyLearningUpdate); setVal(e.session,'homework',e.homeworkAssignment); setVal(e.session,'dueDate',e.dueDate); setVal(e.session,'assessment',e.upcomingAssessment);
  });
  if(show) msg('Recalled saved log.');
}
function clearDraft() {
  if(confirm('Clear this date/grade/day entries from this device?')) { localStorage.removeItem(storageKey()); renderRows(); msg('Cleared.'); }
}
function setVal(session, field, value) { const el = document.querySelector(`[data-session="${session}"][data-field="${field}"]`); if(el) el.value = value || ''; }
function msg(t) { msgEl.textContent = t; setTimeout(()=>{ if(msgEl.textContent===t) msgEl.textContent=''; }, 5000); }
function escapeHtml(s) { return String(s).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])); }

async function submitFinal() {
  saveDraft();
  const data = collectData();
  if(!POWER_AUTOMATE_URL) { msg('Power Automate URL is not added yet. Saved only on this device.'); return; }
  try {
    const res = await fetch(POWER_AUTOMATE_URL, { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(data) });
    msg(res.ok ? 'Final log submitted.' : 'Could not submit. Check Power Automate.');
  } catch(e) { msg('Could not submit. Check internet/Power Automate URL.'); }
}
